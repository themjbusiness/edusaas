name: EduSaas CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Unit Tests (Django)
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-32-chars-long
      DEMO_MODE: "True"
      DATABASE_URL: sqlite:///ci_test.sqlite3
      ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django Tests
        working-directory: backend
        run: |
          python manage.py test

  frontend-e2e:
    name: Frontend Quality & Playwright E2E
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-32-chars-long
      DEMO_MODE: "True"
      DJANGO_DEBUG: "True"
      DATABASE_URL: sqlite:///ci_test.sqlite3
      ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
      CI: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Frontend Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Frontend Unit Tests (Vitest)
        working-directory: web
        run: npm run test

      - name: Frontend Production Build
        working-directory: web
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Migrate Database and Start Backend
        run: |
          cd backend
          python manage.py migrate --noinput
          python manage.py runserver 127.0.0.1:8000 &

      - name: Start Frontend Dev Server
        working-directory: web
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 &

      - name: Wait for Servers to be Ready
        run: |
          echo "Waiting for backend and frontend services..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/api/demo/accounts > /dev/null && curl -s http://127.0.0.1:5173 > /dev/null; then
              echo "Services ready after $i seconds!"
              exit 0
            fi
            sleep 1
          done
          echo "Timeout waiting for services to start"
          exit 1

      - name: Run Playwright E2E Tests
        working-directory: web
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
